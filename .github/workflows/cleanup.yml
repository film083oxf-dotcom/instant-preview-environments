name: Cleanup Preview Environment

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout default branch config
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e

          output=$(npx --yes wrangler@4.136.3 preview delete --name "$PREVIEW_NAME" --skip-confirmation 2>&1)
          status=$?

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -Fq "Preview not found. [code: 10025]" <<< "$output"; then
            echo "Preview $PREVIEW_NAME does not exist. Nothing to clean up."
            exit 0
          fi

          exit "$status"
