name: AI Diagnose Preview Failures

on:
  workflow_run:
    workflows: ["Preview Environment"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      CONTROL_DB_NAME: instant-preview-control-plane

    steps:
      - name: Checkout diagnosis script
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download workflow logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log > logs/preview.log

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run AI diagnosis
        id: diagnose
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_MAX_RETRIES: "4"
          GEMINI_RETRY_BASE_DELAY_MS: "1000"
        run: |
          set -o pipefail
          if node scripts/ai-diagnose.mjs logs/preview.log 2>ai-error.log | tee ai-diagnosis.txt; then
            exit 0
          fi

          {
            echo "## ⚠️ AI diagnosis unavailable"
            echo
            echo "Gemini could not complete the diagnosis after retrying transient failures."
            echo
            echo "The Preview Environment failure itself is still the primary failure to investigate."
            echo
            echo "```text"
            tail -n 20 ai-error.log || true
            echo "```"
          } > ai-diagnosis.txt

          exit 1

      - name: Find PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"             --jq '.pull_requests[0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Ensure control-plane D1
        if: steps.pr.outputs.number != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail
          node scripts/ensure-control-d1.mjs
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=./control-plane.sql

      - name: Mark AI diagnosis state
        if: always() && steps.pr.outputs.number != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
          AI_STATUS: ${{ steps.diagnose.outcome == 'success' && 'DIAGNOSED' || 'UNAVAILABLE' }}
        run: |
          set +e
          node scripts/write-control-state.mjs /tmp/control-state.sql ai ${{ steps.pr.outputs.number }} "$AI_STATUS"
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Comment diagnosis
        if: always() && steps.pr.outputs.number != ''
        uses: actions/github-script@v8
        env:
          DIAGNOSIS_FILE: ai-diagnosis.txt
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('node:fs');
            const diagnosis = fs.readFileSync(process.env.DIAGNOSIS_FILE, 'utf8').trim();
            const body = [
              '## 🤖 AI diagnosis for Preview failure',
              '',
              diagnosis,
              '',
              '> AI output is advisory. Verify against the workflow logs before changing code.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body
            });

      - name: Fail workflow when AI diagnosis failed
        if: steps.diagnose.outcome == 'failure'
        run: exit 1
