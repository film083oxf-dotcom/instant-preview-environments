name: AI Diagnose Preview Failures

on:
  workflow_run:
    workflows: ["Preview Environment"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnosis script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download workflow logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log > logs/preview.log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI diagnosis
        id: diagnose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          node scripts/ai-diagnose.mjs logs/preview.log | tee ai-diagnosis.txt

      - name: Find PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"             --jq '.pull_requests[0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Comment diagnosis
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          DIAGNOSIS_FILE: ai-diagnosis.txt
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('node:fs');
            const diagnosis = fs.readFileSync(process.env.DIAGNOSIS_FILE, 'utf8').trim();
            const body = `## 🤖 AI diagnosis for Preview failure\n\n${diagnosis}\n\n> AI output is advisory. Verify against the workflow logs before changing code.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body
            });
