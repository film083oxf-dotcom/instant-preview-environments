name: Preview Garbage Collector

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      ttl_hours:
        description: "TTL in hours for normal stale environments"
        required: false
        default: "24"
        type: string
      failed_ttl_hours:
        description: "TTL in hours for FAILED/DELETING environments"
        required: false
        default: "6"
        type: string
      delete_stale_open:
        description: "Delete stale environments whose PR is still open"
        required: false
        default: false
        type: boolean

concurrency:
  group: preview-garbage-collector
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      CONTROL_DB_NAME: instant-preview-control-plane
      GC_TTL_HOURS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ttl_hours || '24' }}
      GC_FAILED_TTL_HOURS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.failed_ttl_hours || '6' }}
      GC_DELETE_STALE_OPEN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delete_stale_open || 'false' }}
      PROJECT_ID: instant-preview-environments
      DATABASE_PROVIDER: cloudflare-d1

    steps:
      - name: Checkout default branch config
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Ensure control-plane D1
        id: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail
          node scripts/ensure-control-d1.mjs
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=./control-plane.sql

      - name: Purge expired resource reservations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --command="DELETE FROM project_resource_reservations WHERE datetime(expires_at) <= datetime('now');"

      - name: Find stale environments
        id: stale
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          normal_ttl="${GC_TTL_HOURS}"
          failed_ttl="${GC_FAILED_TTL_HOURS}"

          query="SELECT pr_number, status, updated_at
            FROM project_environments
            WHERE project_id = 'instant-preview-environments'
            AND (
              status IN ('READY','FAILED')
              AND datetime(updated_at) < datetime('now','-' || ${normal_ttl} || ' hours')
            )
            OR (
              status IN ('BUILDING','DELETING','DELETE FAILED')
              AND datetime(updated_at) < datetime('now','-' || ${failed_ttl} || ' hours')
            )
            ORDER BY datetime(updated_at) ASC
            LIMIT 50;"

          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command="$query" > /tmp/stale.json

          echo "Stale candidates:"
          jq -r '.[]?.results? // [] | .[] | [.pr_number, .status, .updated_at] | @tsv' /tmp/stale.json || true

      - name: Reclaim stale environments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          candidates="$(jq -r '.[]?.results? // [] | .[] | [.pr_number, .status, .updated_at] | @tsv' /tmp/stale.json || true)"

          if [ -z "$candidates" ]; then
            echo "No stale environments found."
            exit 0
          fi

          while IFS=$'\t' read -r pr status updated; do
            [ -z "$pr" ] && continue

            state="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.state' 2>/dev/null || echo missing)"

            echo "PR #$pr status=$status updated_at=$updated github_state=$state"

            if [ "$state" = "open" ] && [ "$GC_DELETE_STALE_OPEN" != "true" ]; then
              echo "Skipping open PR #$pr because GC_DELETE_STALE_OPEN=false."
              continue
            fi

            row="$(npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command="SELECT e.commit_sha, e.database_name, b.provider AS branch_provider, b.branch_id FROM project_environments e LEFT JOIN database_branches b ON b.project_id=e.project_id AND b.pr_number=e.pr_number WHERE e.project_id='instant-preview-environments' AND e.pr_number=${pr} ORDER BY b.updated_at DESC LIMIT 1;")"
            database_name="$(printf '%s' "$row" | jq -r '[.[]?.results? // [] | .[]] | .[0].database_name // empty')"
            commit_sha="$(printf '%s' "$row" | jq -r '[.[]?.results? // [] | .[]] | .[0].commit_sha // empty')"
            branch_provider="$(printf '%s' "$row" | jq -r '[.[]?.results? // [] | .[]] | .[0].branch_provider // empty')"
            branch_id="$(printf '%s' "$row" | jq -r '[.[]?.results? // [] | .[]] | .[0].branch_id // empty')"
            database_name="${database_name:-instant-preview-pr-$pr}"
            commit_sha="${commit_sha:-unknown}"
            branch_provider="${branch_provider:-$DATABASE_PROVIDER}"

            echo "Marking PR #$pr DELETING..."
            node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" "$pr" DELETING "$commit_sha" "" "$database_name" ""
            npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

            cleanup_failed="false"

            echo "=== Delete Preview: pr-$pr ==="
            if preview_output="$(node scripts/provider-cli.mjs delete-preview --name "pr-$pr")"; then
              printf '%s\n' "$preview_output"
            else
              printf '%s\n' "$preview_output"
              cleanup_failed="true"
            fi

            echo "=== Delete database branch: $branch_provider ==="
            if [ "$branch_provider" = "neon" ] && [ -n "$branch_id" ]; then
              if db_output="$(DATABASE_PROVIDER=neon node scripts/database-branch-cli.mjs delete --branch-id "$branch_id")"; then
                printf '%s\n' "$db_output"
              else
                printf '%s\n' "$db_output"
                cleanup_failed="true"
              fi
            else
              if db_output="$(DATABASE_PROVIDER=cloudflare-d1 node scripts/database-branch-cli.mjs delete --name "$database_name")"; then
                printf '%s\n' "$db_output"
              else
                printf '%s\n' "$db_output"
                cleanup_failed="true"
              fi
            fi

            if [ "$cleanup_failed" = "false" ]; then
              node scripts/write-database-branch-state.mjs /tmp/database-branch-gc.sql delete "$PROJECT_ID" "$pr" "$branch_provider" || true
              npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/database-branch-gc.sql || true
            fi

            if [ "$cleanup_failed" = "true" ]; then
              echo "GC cleanup failed for PR #$pr."
              node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" "$pr" "DELETE FAILED" "$commit_sha" "" "$database_name" "Garbage collector cleanup failed."
              npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql
              continue
            fi

            echo "GC cleanup succeeded for PR #$pr."
            node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" "$pr" DELETED "$commit_sha" "" "$database_name" ""
            npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

          done <<< "$candidates"

      - name: Write GC summary
        run: |
          {
            echo "## 🧹 Preview Garbage Collector"
            echo
            echo "- Normal TTL: ${GC_TTL_HOURS}h"
            echo "- Failed/Delete TTL: ${GC_FAILED_TTL_HOURS}h"
            echo "- Delete stale open PRs: ${GC_DELETE_STALE_OPEN}"
            echo
            echo "Stale environments were reclaimed directly by the GC when eligible."
          } >> "$GITHUB_STEP_SUMMARY"
