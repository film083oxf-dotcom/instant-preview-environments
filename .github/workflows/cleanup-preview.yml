name: Cleanup Preview Environment

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      CONTROL_DB_NAME: instant-preview-control-plane
      PROJECT_ID: instant-preview-environments
      DATABASE_PROVIDER: cloudflare-d1

    steps:
      - name: Checkout default branch config
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Provision control-plane D1
        id: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail
          node scripts/ensure-control-d1.mjs
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=./control-plane.sql

      - name: Resolve database branch identifiers
        id: ids
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail

          result="$(npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command "SELECT commit_sha, database_name FROM project_environments WHERE project_id = 'instant-preview-environments' AND pr_number = ${PR_NUMBER} LIMIT 1;")"
          row="$(printf '%s' "$result" | jq -c '[.[]?.results? // [] | .[]] | .[0] // empty')"

          db_name="$(jq -r '.database_name // empty' <<<"$row")"
          sha="${{ github.event.pull_request.head.sha }}"

          branch_result="$(npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command "SELECT provider, branch_id, branch_name, database_name FROM database_branches WHERE project_id='instant-preview-environments' AND pr_number=${PR_NUMBER} ORDER BY updated_at DESC LIMIT 1;")"
          branch_row="$(printf '%s' "$branch_result" | jq -c '[.[]?.results? // [] | .[]] | .[0] // empty')"

          provider="$(jq -r '.provider // empty' <<<"$branch_row")"
          branch_id="$(jq -r '.branch_id // empty' <<<"$branch_row")"
          branch_name="$(jq -r '.branch_name // empty' <<<"$branch_row")"
          branch_database="$(jq -r '.database_name // empty' <<<"$branch_row")"

          provider="${provider:-$DATABASE_PROVIDER}"
          branch_id="${branch_id:-}"
          branch_name="${branch_name:-$db_name}"
          branch_database="${branch_database:-$db_name}"

          echo "database_name=${branch_database:-instant-preview-pr-$PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch_provider=$provider" >> "$GITHUB_OUTPUT"
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "head_sha=${sha:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Release preview resource reservation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set +e
          node scripts/write-resource-reservation.mjs /tmp/resource-reservation-release.sql release "$PROJECT_ID" "${{ github.event.pull_request.number }}"
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/resource-reservation-release.sql

      - name: Mark environment DELETING
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" "$PR_NUMBER" DELETING "${{ steps.ids.outputs.head_sha }}" "" "${{ steps.ids.outputs.database_name }}" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Delete Preview and isolated database branch
        id: cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_PROVIDER: ${{ steps.ids.outputs.branch_provider }}
        run: |
          set -euo pipefail

          echo "=== Delete Preview: $PREVIEW_NAME ==="
          preview_output="$(node scripts/provider-cli.mjs delete-preview --name "$PREVIEW_NAME")"
          printf '%s\n' "$preview_output"

          preview_not_found="$(printf '%s' "$preview_output" | jq -r '.notFound // false')"
          test "$preview_not_found" = "false" || echo "Preview $PREVIEW_NAME was already absent."

          echo "=== Delete database branch: $DATABASE_PROVIDER ==="
          if [ "$DATABASE_PROVIDER" = "neon" ]; then
            db_output="$(node scripts/database-branch-cli.mjs delete --branch-id "${{ steps.ids.outputs.branch_id }}")"
          else
            db_output="$(node scripts/database-branch-cli.mjs delete --name "${{ steps.ids.outputs.database_name }}")"
          fi
          printf '%s\n' "$db_output"

          echo "Cleanup completed for $PREVIEW_NAME and ${{ steps.ids.outputs.database_name }}."



      - name: Mark environment DELETED
        if: steps.cleanup.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" "$PR_NUMBER" DELETED "${{ steps.ids.outputs.head_sha }}" "" "${{ steps.ids.outputs.database_name }}" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Mark environment DELETE FAILED
        if: always() && steps.cleanup.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" "$PR_NUMBER" "DELETE FAILED" "${{ steps.ids.outputs.head_sha }}" "" "${{ steps.ids.outputs.database_name }}" "Cleanup workflow failed."
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql
