name: Cleanup Preview Environment

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to clean up"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
      CONTROL_DB_NAME: instant-preview-control-plane

    steps:
      - name: Checkout default branch config
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve Pull Request metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          sha=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha // empty' || true)

          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Provision control-plane D1
        id: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail
          node scripts/ensure-control-d1.mjs
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=./control-plane.sql

      - name: Resolve cleanup identifiers
        id: ids
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail

          result="$(npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command "SELECT status, commit_sha, database_name FROM environments WHERE pr_number = ${PR_NUMBER} LIMIT 1;")"

          row="$(printf '%s' "$result" | jq -c '[.[]?.results? // [] | .[]] | .[0] // empty')"

          db_name="$(jq -r '.database_name // empty' <<<"$row")"
          sha="${{ steps.pr.outputs.head_sha }}"
          if [ -z "$sha" ]; then
            sha="$(jq -r '.commit_sha // empty' <<<"$row")"
          fi

          echo "database_name=${db_name:-instant-preview-pr-$PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${sha:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Mark environment DELETING
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PR_NUMBER" DELETING "${{ steps.ids.outputs.head_sha }}" "" "${{ steps.ids.outputs.database_name }}" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Delete Preview and isolated D1
        id: cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ env.PR_NUMBER }}
          PREVIEW_DB_NAME: ${{ steps.ids.outputs.database_name }}
        run: |
          set +e

          echo "=== Delete Preview: $PREVIEW_NAME ==="
          preview_output=$(npx --yes wrangler@4.136.3 preview delete --name "$PREVIEW_NAME" --skip-confirmation 2>&1)
          preview_status=$?
          printf '%s
' "$preview_output"

          if [ "$preview_status" -ne 0 ] && ! grep -Fq "Preview not found. [code: 10025]" <<< "$preview_output"; then
            echo "Preview deletion failed."
            exit "$preview_status"
          fi

          echo "=== Delete isolated D1: $PREVIEW_DB_NAME ==="
          db_output=$(npx --yes wrangler@4.136.3 d1 delete "$PREVIEW_DB_NAME" --skip-confirmation 2>&1)
          db_status=$?
          printf '%s
' "$db_output"

          if [ "$db_status" -ne 0 ]; then
            if grep -Eiq "not found|does not exist|No database|could not find|Couldn't find a D1 DB|Couldn't find.*D1" <<< "$db_output"; then
              echo "D1 $PREVIEW_DB_NAME does not exist. Nothing to delete."
              exit 0
            fi

            echo "D1 deletion failed."
            exit "$db_status"
          fi

          echo "Cleanup completed for $PREVIEW_NAME and $PREVIEW_DB_NAME."

      - name: Mark environment DELETED
        if: steps.cleanup.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PR_NUMBER" DELETED "${{ steps.ids.outputs.head_sha }}" "" "${{ steps.ids.outputs.database_name }}" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Mark environment DELETE FAILED
        if: always() && steps.cleanup.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PR_NUMBER" "DELETE FAILED" "${{ steps.ids.outputs.head_sha }}" "" "${{ steps.ids.outputs.database_name }}" "Cleanup workflow failed."
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql
