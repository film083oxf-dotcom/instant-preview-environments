name: Cleanup Failure Reconciler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cleanup-failure-reconciler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CONTROL_DB_NAME: instant-preview-control-plane
      PROJECT_ID: instant-preview-environments

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Find failed cleanups
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/ensure-control-d1.mjs
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=./control-plane.sql
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command="SELECT pr_number, commit_sha, database_name FROM project_environments WHERE project_id='$PROJECT_ID' AND status='DELETE FAILED' ORDER BY datetime(updated_at) ASC LIMIT 50;" > /tmp/delete-failed.json
          jq -r '.[]?.results? // [] | .[] | [.pr_number, .commit_sha, .database_name] | @tsv' /tmp/delete-failed.json > /tmp/delete-failed.tsv

      - name: Reconcile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/delete-failed.tsv ]; then echo "No DELETE FAILED environments found."; exit 0; fi
          while IFS=$'\t' read -r pr commit_sha database_name; do
            [ -z "$pr" ] && continue
            commit_sha="${commit_sha:-unknown}"
            database_name="${database_name:-instant-preview-pr-$pr}"
            echo "Reconciling PR #$pr"
            if ! node scripts/provider-cli.mjs delete-preview --name "pr-$pr" > /tmp/preview-delete.json; then cat /tmp/preview-delete.json || true; continue; fi
            if ! DATABASE_PROVIDER=cloudflare-d1 node scripts/database-branch-cli.mjs delete --name "$database_name" > /tmp/database-delete.json; then cat /tmp/database-delete.json || true; continue; fi
            node scripts/write-database-branch-state.mjs /tmp/database-branch.sql delete "$PROJECT_ID" "$pr" cloudflare-d1 || true
            npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/database-branch.sql || true
            node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" "$pr" DELETED "$commit_sha" "" "$database_name" ""
            npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql
          done < /tmp/delete-failed.tsv