name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # MVP security rule: deploy only PRs from this repository.
    # Do not expose Cloudflare credentials to forked PR code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No npm cache: this MVP intentionally has no lockfile yet.

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler preview --name "$PREVIEW_NAME" --json | tee preview-output.json

          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('preview-output.json', 'utf8');
          const urls = [...text.matchAll(/https:\/\/[^\s"']+/g)].map(m => m[0]);
          const previewUrl = urls.find(u => !u.includes('api.cloudflare.com')) || urls[0] || '';
          if (!previewUrl) {
            console.error('Could not find a Preview URL in Wrangler output.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `preview_url=${previewUrl.replace(/\r?\n/g, '')}\n`);
          NODE

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.preview_url }}`;
            const body = [
              '## ✅ Preview Environment Ready',
              '',
              `**PR:** #${context.issue.number}`,
              `**Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `**Preview:** ${url}`,
              '',
              'Push another commit to this PR to update the same preview environment.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Save preview metadata
        run: |
          echo "preview_name=$PREVIEW_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "preview_url=${{ steps.deploy.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
