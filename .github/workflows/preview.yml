name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      PREVIEW_DB_NAME: instant-preview-pr-${{ github.event.pull_request.number }}
      CONTROL_DB_NAME: instant-preview-control-plane
      PROJECT_ID: instant-preview-environments

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Preview session signing key
        env:
          SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SESSION_SIGNING_KEY" ]; then
            echo "::error::Missing required GitHub Actions secret SESSION_SIGNING_KEY."
            exit 1
          fi

      - name: Sync Preview base session secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SESSION_SIGNING_KEY" | npx --yes wrangler@4.136.3 preview base-config secret put SESSION_SIGNING_KEY --worker-name instant-preview-environments

      - name: Provision control-plane D1
        id: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail
          node scripts/ensure-control-d1.mjs

      - name: Apply control-plane schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=./control-plane.sql

      - name: Reserve project resources
        id: resource_reservation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail

          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --command="DELETE FROM project_resource_reservations WHERE project_id='$PROJECT_ID' AND pr_number=${{ github.event.pull_request.number }};"
          node scripts/write-resource-reservation.mjs /tmp/resource-reservation.sql reserve "$PROJECT_ID" "${{ github.event.pull_request.number }}"
          reservation_sql="$(cat /tmp/resource-reservation.sql)"
          response="$(npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command="$reservation_sql")"
          printf '%s\n' "$response"

          reserved="$(printf '%s' "$response" | jq -r '[.[]?.results? // [] | .[] | .reserved // empty] | .[0] // empty')"
          if [ -z "$reserved" ]; then
            echo "Project resource quota reached. No preview capacity was reserved."

            usage="$(npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --json --command="SELECT q.max_active_environments, q.max_active_databases, q.max_concurrent_builds, (SELECT COUNT(*) FROM project_environments e WHERE e.project_id='$PROJECT_ID' AND e.status IN ('BUILDING','READY','FAILED','UPDATING','DELETING','DELETE FAILED')) AS active_environments, (SELECT COUNT(*) FROM project_environments e WHERE e.project_id='$PROJECT_ID' AND e.status IN ('BUILDING','UPDATING')) AS concurrent_builds FROM project_quotas q WHERE q.project_id='$PROJECT_ID';")"
            printf '%s\n' "$usage" | jq -r '.[]?.results? // [] | .[] | "capacity: environments \(.active_environments)/\(.max_active_environments), databases quota \(.max_active_databases), builds \(.concurrent_builds)/\(.max_concurrent_builds)"' || true
            exit 78
          fi

          echo "Project resource reservation acquired."

      - name: Mark environment BUILDING
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" ${{ github.event.pull_request.number }} BUILDING ${{ github.event.pull_request.head.sha }} "" "$PREVIEW_DB_NAME" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Provision isolated D1 database
        id: database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          result="$(node scripts/provider-cli.mjs ensure-preview-db --name "$PREVIEW_DB_NAME")"
          printf '%s
' "$result"

          db_id="$(printf '%s' "$result" | jq -r '.id // empty')"
          created="$(printf '%s' "$result" | jq -r '.created // false')"

          if [ -z "$db_id" ]; then
            echo "Provider did not return a preview database ID."
            exit 1
          fi

          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "database_name=$PREVIEW_DB_NAME" >> "$GITHUB_OUTPUT"
          echo "database_created=$created" >> "$GITHUB_OUTPUT"

      - name: Apply isolated D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if npx --yes wrangler@4.136.3 d1 execute "$PREVIEW_DB_NAME" --remote --yes --file=./schema.sql; then
              exit 0
            fi
            echo "D1 schema apply attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done

          exit 1

      - name: Generate Preview Wrangler config
        env:
          PREVIEW_DB_ID: ${{ steps.database.outputs.database_id }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
          CONTROL_DB_ID: ${{ steps.control.outputs.database_id }}
          CONTROL_DB_NAME: ${{ steps.control.outputs.database_name }}
        run: |
          set -euo pipefail
          node scripts/generate-preview-config.mjs             "$PREVIEW_DB_ID"             "$PREVIEW_DB_NAME"             "$PREVIEW_NAME"             "$CONTROL_DB_ID"             "$CONTROL_DB_NAME"

      - name: Deploy Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_PROVIDER: cloudflare
        run: |
          set -euo pipefail
          node scripts/provider-cli.mjs deploy-preview --name "$PREVIEW_NAME" --config wrangler.preview.generated.jsonc

      - name: Smoke test Preview readiness
        if: steps.preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url || steps.preview.outputs.preview-deployment-url }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          response="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --write-out '\n%{http_code}' \
            "$PREVIEW_URL/ready")"

          code="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"

          echo "HTTP $code"
          printf '%s\n' "$body"

          test "$code" = "200"
          printf '%s' "$body" | jq -e '.ok == true and .ready == true and .checks.controlPlane == true and .checks.previewDatabase == true'
      - name: Mark environment READY
        if: steps.preview.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url || steps.preview.outputs.preview-deployment-url }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" ${{ github.event.pull_request.number }} READY ${{ github.event.pull_request.head.sha }} "$PREVIEW_URL" "$PREVIEW_DB_NAME" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Release project resource reservation
        if: always() && steps.resource_reservation.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set +e
          node scripts/write-resource-reservation.mjs /tmp/resource-reservation-release.sql release "$PROJECT_ID" "${{ github.event.pull_request.number }}"
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/resource-reservation-release.sql

      - name: Comment on PR
        if: steps.preview.outcome == 'success'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview-name }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
        with:
          script: |
            const url = process.env.PREVIEW_URL || process.env.PREVIEW_DEPLOYMENT_URL;
            if (!url) core.setFailed('Cloudflare did not return a Preview URL.');
            const body = [
              '## ✅ Preview Environment Ready',
              '',
              `**PR:** #${context.issue.number}`,
              `**Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `**Environment:** ${process.env.PREVIEW_NAME || 'preview'}`,
              `**Preview:** ${url}`,
              `**Database:** D1 \`${process.env.PREVIEW_DB_NAME}\` (isolated for this PR)`,
              '',
              '**Access:** sign in with GitHub',
              '**Authentication:** the Preview uses the same GitHub identity as the platform',
              '',
              'Push another commit to this PR to update the same preview environment and keep the same isolated database.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Write preview metadata to job summary
        if: steps.preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
        run: |
          {
            echo "Preview URL: $PREVIEW_URL"
            echo "Isolated D1: $PREVIEW_DB_NAME"
            echo "Database endpoint: $PREVIEW_URL/db"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back newly created D1 after failed Preview provisioning
        if: failure() && steps.preview.outcome != 'success' && steps.database.outputs.database_created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_DB_ID: ${{ steps.database.outputs.database_id }}
        run: |
          set +e
          curl -sS -X DELETE             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PREVIEW_DB_ID"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json" | tee /tmp/d1-delete-response.json

      - name: Mark environment FAILED
        if: always() && steps.preview.outcome != 'success' && steps.control.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ steps.control.outputs.database_name }}
          ERROR_MESSAGE: Preview workflow failed before a ready deployment was produced.
        run: |
          set +e
          node scripts/write-control-state.mjs /tmp/control-state.sql environment "$PROJECT_ID" ${{ github.event.pull_request.number }} FAILED ${{ github.event.pull_request.head.sha }} "" "$PREVIEW_DB_NAME" "$ERROR_MESSAGE"
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql
