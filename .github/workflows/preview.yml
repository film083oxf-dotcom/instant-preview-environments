name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Deploy Preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: preview --name ${{ env.PREVIEW_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview-name }}
        with:
          script: |
            const url = process.env.PREVIEW_URL || process.env.PREVIEW_DEPLOYMENT_URL;
            if (!url) core.setFailed('Cloudflare did not return a Preview URL.');
            const body = [
              '## ✅ Preview Environment Ready',
              '',
              `**PR:** #${context.issue.number}`,
              `**Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `**Environment:** ${process.env.PREVIEW_NAME || 'preview'}`,
              `**Preview:** ${url}`,
              '',
              'Push another commit to this PR to update the same preview environment.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Write preview URL to job summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          echo "Preview URL: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
