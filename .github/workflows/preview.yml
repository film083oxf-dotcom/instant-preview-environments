name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      PREVIEW_DB_NAME: instant-preview-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Provision isolated D1 database
        id: database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          db_id=""

          if info="$(npx --yes wrangler@4.136.3 d1 info "$PREVIEW_DB_NAME" --json 2>/dev/null)"; then
            db_id="$(printf '%s' "$info" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s); process.stdout.write(x.uuid || "")}catch{}})')"
          fi

          if [ -z "$db_id" ]; then
            echo "D1 database $PREVIEW_DB_NAME does not exist. Creating it..."
            output="$(npx --yes wrangler@4.136.3 d1 create "$PREVIEW_DB_NAME" --binding DB --use-remote --update-config=false 2>&1)"
            printf '%s\n' "$output"
            db_id="$(printf '%s' "$output" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1 || true)"
          fi

          if [ -z "$db_id" ]; then
            echo "Unable to determine D1 database ID."
            exit 1
          fi

          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "database_name=$PREVIEW_DB_NAME" >> "$GITHUB_OUTPUT"

      - name: Apply isolated D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.136.3 d1 execute "$PREVIEW_DB_NAME" --remote --yes --file=./schema.sql; then
              exit 0
            fi
            echo "D1 schema apply attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done
          exit 1

      - name: Generate Preview Wrangler config
        env:
          PREVIEW_DB_ID: ${{ steps.database.outputs.database_id }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
        run: |
          set -euo pipefail
          node scripts/generate-preview-config.mjs "$PREVIEW_DB_ID" "$PREVIEW_DB_NAME" "$PREVIEW_NAME"

      - name: Deploy Preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: preview --name ${{ env.PREVIEW_NAME }} --config wrangler.preview.generated.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview-name }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
        with:
          script: |
            const url = process.env.PREVIEW_URL || process.env.PREVIEW_DEPLOYMENT_URL;
            if (!url) core.setFailed('Cloudflare did not return a Preview URL.');
            const body = [
              '## ✅ Preview Environment Ready',
              '',
              `**PR:** #${context.issue.number}`,
              `**Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `**Environment:** ${process.env.PREVIEW_NAME || 'preview'}`,
              `**Preview:** ${url}`,
              `**Database:** D1 \`${process.env.PREVIEW_DB_NAME}\` (isolated for this PR)`,
              '',
              'Push another commit to this PR to update the same preview environment and keep the same isolated database.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Write preview metadata to job summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
        run: |
          {
            echo "Preview URL: $PREVIEW_URL"
            echo "Isolated D1: $PREVIEW_DB_NAME"
            echo "Database endpoint: $PREVIEW_URL/db"
          } >> "$GITHUB_STEP_SUMMARY"
