name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      PREVIEW_DB_NAME: instant-preview-pr-${{ github.event.pull_request.number }}
      CONTROL_DB_NAME: instant-preview-control-plane

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Preview session signing key
        env:
          SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SESSION_SIGNING_KEY" ]; then
            echo "::error::Missing required GitHub Actions secret SESSION_SIGNING_KEY."
            exit 1
          fi

      - name: Sync Preview base session secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SESSION_SIGNING_KEY" | npx --yes wrangler@4.136.3 preview base-config secret put SESSION_SIGNING_KEY --worker-name instant-preview-environments

      - name: Provision control-plane D1
        id: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ env.CONTROL_DB_NAME }}
        run: |
          set -euo pipefail
          node scripts/ensure-control-d1.mjs

      - name: Apply control-plane schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=./control-plane.sql

      - name: Mark environment BUILDING
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment ${{ github.event.pull_request.number }} BUILDING ${{ github.event.pull_request.head.sha }} "" "$PREVIEW_DB_NAME" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Provision isolated D1 database
        id: database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          list_response="$(curl -sS -G "$api" "${headers[@]}"             --data-urlencode "name=$PREVIEW_DB_NAME"             --data-urlencode "per_page=10000")"

          if ! jq -e '.success == true' >/dev/null <<<"$list_response"; then
            echo "Cloudflare D1 list request failed:"
            echo "$list_response"
            exit 1
          fi

          db_id="$(jq -r '.result[0].uuid // empty' <<<"$list_response")"
          created="false"

          if [ -z "$db_id" ]; then
            echo "D1 database $PREVIEW_DB_NAME does not exist. Creating it..."

            create_payload="$(jq -nc --arg name "$PREVIEW_DB_NAME" '{name:$name}')"
            create_response="$(curl -sS -X POST "$api" "${headers[@]}"               --data "$create_payload")"

            if ! jq -e '.success == true' >/dev/null <<<"$create_response"; then
              echo "Cloudflare D1 create request failed:"
              echo "$create_response"
              exit 1
            fi

            db_id="$(jq -r '.result.uuid // empty' <<<"$create_response")"
            created="true"
          else
            echo "Reusing existing D1 database $PREVIEW_DB_NAME."
          fi

          if [ -z "$db_id" ]; then
            echo "Cloudflare did not return a D1 database ID."
            exit 1
          fi

          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "database_name=$PREVIEW_DB_NAME" >> "$GITHUB_OUTPUT"
          echo "database_created=$created" >> "$GITHUB_OUTPUT"

      - name: Apply isolated D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if npx --yes wrangler@4.136.3 d1 execute "$PREVIEW_DB_NAME" --remote --yes --file=./schema.sql; then
              exit 0
            fi
            echo "D1 schema apply attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done

          exit 1

      - name: Generate Preview Wrangler config
        env:
          PREVIEW_DB_ID: ${{ steps.database.outputs.database_id }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
          CONTROL_DB_ID: ${{ steps.control.outputs.database_id }}
          CONTROL_DB_NAME: ${{ steps.control.outputs.database_name }}
        run: |
          set -euo pipefail
          node scripts/generate-preview-config.mjs             "$PREVIEW_DB_ID"             "$PREVIEW_DB_NAME"             "$PREVIEW_NAME"             "$CONTROL_DB_ID"             "$CONTROL_DB_NAME"

      - name: Deploy Preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: preview --name ${{ env.PREVIEW_NAME }} --config wrangler.preview.generated.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark environment READY
        if: steps.preview.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url || steps.preview.outputs.preview-deployment-url }}
        run: |
          set -euo pipefail
          node scripts/write-control-state.mjs /tmp/control-state.sql environment ${{ github.event.pull_request.number }} READY ${{ github.event.pull_request.head.sha }} "$PREVIEW_URL" "$PREVIEW_DB_NAME" ""
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql

      - name: Comment on PR
        if: steps.preview.outcome == 'success'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview-name }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
        with:
          script: |
            const url = process.env.PREVIEW_URL || process.env.PREVIEW_DEPLOYMENT_URL;
            if (!url) core.setFailed('Cloudflare did not return a Preview URL.');
            const body = [
              '## ✅ Preview Environment Ready',
              '',
              `**PR:** #${context.issue.number}`,
              `**Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `**Environment:** ${process.env.PREVIEW_NAME || 'preview'}`,
              `**Preview:** ${url}`,
              `**Database:** D1 \`${process.env.PREVIEW_DB_NAME}\` (isolated for this PR)`,
              '',
              '**Access:** protected by HTTP Basic Auth',
              '**Username:** \`preview\`',
              '**Password:** the value stored in GitHub Actions secret \`PREVIEW_ACCESS_PASSWORD\`',
              '',
              'Push another commit to this PR to update the same preview environment and keep the same isolated database.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Write preview metadata to job summary
        if: steps.preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_DB_NAME: ${{ steps.database.outputs.database_name }}
        run: |
          {
            echo "Preview URL: $PREVIEW_URL"
            echo "Isolated D1: $PREVIEW_DB_NAME"
            echo "Database endpoint: $PREVIEW_URL/db"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back newly created D1 after failed Preview provisioning
        if: failure() && steps.preview.outcome != 'success' && steps.database.outputs.database_created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_DB_ID: ${{ steps.database.outputs.database_id }}
        run: |
          set +e
          curl -sS -X DELETE             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PREVIEW_DB_ID"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json" | tee /tmp/d1-delete-response.json

      - name: Mark environment FAILED
        if: always() && steps.preview.outcome != 'success' && steps.control.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_DB_NAME: ${{ steps.control.outputs.database_name }}
          ERROR_MESSAGE: Preview workflow failed before a ready deployment was produced.
        run: |
          set +e
          node scripts/write-control-state.mjs /tmp/control-state.sql environment ${{ github.event.pull_request.number }} FAILED ${{ github.event.pull_request.head.sha }} "" "$PREVIEW_DB_NAME" "$ERROR_MESSAGE"
          npx --yes wrangler@4.136.3 d1 execute "$CONTROL_DB_NAME" --remote --yes --file=/tmp/control-state.sql
